name: Campground CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: 1
  EXPO_NO_TELEMETRY: 1

jobs:
  verify:
    name: Lint + typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (extension + campground workspaces)
        run: npm test

  web-export:
    name: Expo web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Export web bundle
        run: npm run export:web --workspace=@campground/mobile

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: apps/mobile/dist
