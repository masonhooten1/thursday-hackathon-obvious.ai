name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # RLS tests run against real Postgres with Supabase-style roles —
        # acceptance check 9's database layer has no mock.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      # Deterministic test-only keys (tests/setup.ts defaults to the same
      # values when these are unset; setting them here keeps CI explicit).
      SUPABASE_JWT_SECRET: ci-only-supabase-jwt-secret-0123456789
      SETTINGS_ENCRYPTION_KEY: dGhpcy1pcy1hLTMyLWJ5dGUtdGVzdC1rZXktISEhIQ==
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
